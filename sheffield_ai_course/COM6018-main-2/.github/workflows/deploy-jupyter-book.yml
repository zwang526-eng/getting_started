name: Deploy Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install book dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jupyter-book==1.0.4" \
            matplotlib \
            numpy \
            pandas \
            seaborn \
            cartopy \
            scikit-learn \
            xlrd \
            httpx \
            pyarrow \
            sqlalchemy \
            pymysql

      - name: Build Jupyter Book
        run: |
          jb clean .
          jb build . --keep-going

      - name: Copy additional materials
        run: |
          if [ -d "materials/lectures" ]; then
            mkdir -p _build/html/materials
            cp -r materials/lectures _build/html/materials/
          fi

          if [ -d "materials/lab_intros" ]; then
            mkdir -p _build/html/materials
            cp -r materials/lab_intros _build/html/materials/
          fi

          touch _build/html/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
